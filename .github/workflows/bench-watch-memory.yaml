name: Watch Memory Benchmark

on:
  workflow_dispatch:
  schedule:
    # Run weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  bench-watch-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Run benchmark
        run: |
          ./dev/tasks/bench-watch-memory | tee bench-watch-memory.txt

      - name: Record results in summary
        run: |
          {
            echo "## kubecache Watch Memory Benchmark"
            echo ""
            echo "- **Commit:** \`$(git rev-parse HEAD)\`"
            echo "- **Go version:** \`$(go version)\`"
            echo "- **Runner:** ubuntu-latest (${RUNNER_OS} ${RUNNER_ARCH})"
            echo "- **Note:** Results from shared runners are noisy."
            echo ""
            echo '```'
            cat bench-watch-memory.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: bench-watch-memory
          path: |
            bench-watch-memory.log
            bench-watch-memory.txt
          if-no-files-found: ignore
