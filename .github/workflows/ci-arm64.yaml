name: CI arm64

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ap-test-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      ARTIFACTS: /tmp/artifacts
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # ratchet:actions/setup-go@v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: Run ap-test
        run: ./dev/ci/presubmits/ap-test

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: artifacts-ap-test-arm64
          path: /tmp/artifacts
          if-no-files-found: ignore
