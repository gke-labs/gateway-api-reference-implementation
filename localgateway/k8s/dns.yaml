apiVersion: v1
kind: ServiceAccount
metadata:
  name: localgateway-dns
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: localgateway-dns
rules:
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: localgateway-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: localgateway-dns
subjects:
- kind: ServiceAccount
  name: localgateway-dns
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localgateway-dns
  namespace: default
  labels:
    app: localgateway-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localgateway-dns
  template:
    metadata:
      labels:
        app: localgateway-dns
    spec:
      serviceAccountName: localgateway-dns
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: dns
        image: localgateway-dns:latest
        imagePullPolicy: IfNotPresent
        args:
        - --gateway-class=localgateway
        ports:
        - name: mdns
          containerPort: 5353
          protocol: UDP
