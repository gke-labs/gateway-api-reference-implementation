apiVersion: v1
kind: ServiceAccount
metadata:
  name: localgateway-dns
  namespace: default
---
# localgateway-dns is permitted to read only its own config Secret ("localgateway-dns"
# in the default namespace). It has no access to Gateways, TLS Secrets, or any other Gateway's config.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: localgateway-dns
  namespace: default
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["localgateway-dns"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: localgateway-dns
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: localgateway-dns
subjects:
- kind: ServiceAccount
  name: localgateway-dns
  namespace: default
---
# localgateway-dns runs as a Deployment with 1 replica rather than a DaemonSet
# because multiple mDNS responders cannot share UDP port 5353 on the same host network,
# and a single responder instance answers multicast queries for the entire LAN.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localgateway-dns
  namespace: default
  labels:
    app: localgateway-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localgateway-dns
  template:
    metadata:
      labels:
        app: localgateway-dns
    spec:
      serviceAccountName: localgateway-dns
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: dns
        image: localgateway-dns:latest
        imagePullPolicy: IfNotPresent
        args:
        - --config-secret=localgateway-dns
        - --config-namespace=default
        ports:
        - name: mdns
          containerPort: 5353
          protocol: UDP
        # UDP 5353 is an unprivileged port (>= 1024), so no added capabilities
        # (such as NET_BIND_SERVICE) or privilege escalation are needed.
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
