apiVersion: v1
kind: ServiceAccount
metadata:
  name: localgateway-controller
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: localgateway-controller
rules:
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes", "gateways", "gatewayclasses", "referencegrants"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways/status", "gatewayclasses/status", "httproutes/status"]
  verbs: ["update", "patch"]
- apiGroups: [""]
  resources: ["services", "namespaces", "configmaps", "nodes"]
  verbs: ["get", "list", "watch"]
# Permission to manage only the DNS data plane configuration Secret (localgateway-dns).
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["localgateway-dns"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch", "update"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: localgateway-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: localgateway-controller
subjects:
- kind: ServiceAccount
  name: localgateway-controller
  namespace: default
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: localgateway
spec:
  controllerName: github.com/gke-labs/gateway-api-reference-implementation/localgateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localgateway-controller
  namespace: default
  labels:
    app: localgateway-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localgateway-controller
  template:
    metadata:
      labels:
        app: localgateway-controller
    spec:
      serviceAccountName: localgateway-controller
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: controller
        image: localgateway:latest
        imagePullPolicy: IfNotPresent
        args:
        - --controller-name=github.com/gke-labs/gateway-api-reference-implementation/localgateway
        - --proxy-bind-address=:80
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: http
          containerPort: 80
        - name: mdns
          containerPort: 5353
          protocol: UDP
        - name: metrics
          containerPort: 8999
        securityContext:
          # Note: allowPrivilegeEscalation must not be set to false; doing so
          # clears the process's effective capability set and prevents the
          # non-root user (65532) from using the binary's cap_net_bind_service capability.
          capabilities:
            add:
            - NET_BIND_SERVICE
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8999
          initialDelaySeconds: 1
          periodSeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8999
          initialDelaySeconds: 5
          periodSeconds: 10
