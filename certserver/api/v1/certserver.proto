syntax = "proto3";

package certserver.v1;

option go_package = "github.com/gke-labs/gateway-api-reference-implementation/certserver/api/v1;certserverv1";

// CertificateService provides TLS certificate retrieval for GARI controllers.
service CertificateService {
  // GetCertificate retrieves a certificate chain (and private key in release mode)
  // for the specified hostnames and Gateway. If not already cached, issuance is
  // started asynchronously and pending HTTP-01 challenges are returned.
  rpc GetCertificate(GetCertificateRequest) returns (GetCertificateResponse);
}

message GetCertificateRequest {
  // The hostnames requested for the certificate.
  repeated string hostnames = 1;

  // The Gateway resource identity in "namespace/name" format.
  string gateway = 2;

  // The service account of the data plane that will serve this Gateway.
  string data_plane_service_account = 3;

  // Optional explicit cluster ID. If omitted, derived from the caller's verified token issuer.
  string cluster_id = 4;

  // Optional bearer token if not passed in gRPC Authorization metadata.
  string token = 5;

  // Attested external addresses of the Gateway.
  repeated string addresses = 6;
}

message HTTP01Challenge {
  // The hostname for which the challenge is issued.
  string hostname = 1;

  // The challenge token.
  string token = 2;

  // The key authorization response string.
  string key_authorization = 3;
}

message GetCertificateResponse {
  // PEM-encoded certificate chain (leaf certificate followed by intermediate CA certificates).
  bytes certificate_chain = 1;

  // PEM-encoded private key for the leaf certificate (present only in release mode).
  bytes private_key = 2;

  // Pending HTTP-01 challenges that the caller's Gateway should serve.
  repeated HTTP01Challenge challenges = 3;
}
