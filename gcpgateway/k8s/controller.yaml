apiVersion: v1
kind: ServiceAccount
metadata:
  name: gcpgateway-controller
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gcpgateway-controller
rules:
# 1. Gateway API core routing resources and status updates
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways", "gatewayclasses", "httproutes", "backendtlspolicies", "referencegrants", "listenersets"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["tlsroutes", "grpcroutes", "tcproutes", "udproutes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways/status", "gatewayclasses/status", "httproutes/status", "backendtlspolicies/status", "listenersets/status", "tlsroutes/status", "grpcroutes/status", "tcproutes/status", "udproutes/status"]
  verbs: ["update", "patch"]
# 2. Singlepod provisioner resources (to deploy and configure per-Gateway data plane instances)
- apiGroups: [""]
  resources: ["services", "serviceaccounts", "secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["configmaps", "namespaces"]
  verbs: ["get", "list", "watch"]
# 3. NEG registrar discovery (nodes for zone/instance resolution, endpoint slices for endpoints)
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
# 4. Data-plane pod discovery and readiness gate status patching
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/status"]
  verbs: ["update", "patch"]
# 5. Gateway API CRD verification
# GARI's CRDView runs field-selected metadata informers on the named Gateway API CRDs
# to track served kinds and the Gateway API bundle version at runtime.
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  resourceNames:
  - "gatewayclasses.gateway.networking.k8s.io"
  - "gateways.gateway.networking.k8s.io"
  - "httproutes.gateway.networking.k8s.io"
  - "tlsroutes.gateway.networking.k8s.io"
  - "grpcroutes.gateway.networking.k8s.io"
  - "tcproutes.gateway.networking.k8s.io"
  - "udproutes.gateway.networking.k8s.io"
  - "backendtlspolicies.gateway.networking.k8s.io"
  - "listenersets.gateway.networking.k8s.io"
  - "referencegrants.gateway.networking.k8s.io"
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gcpgateway-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gcpgateway-controller
subjects:
- kind: ServiceAccount
  name: gcpgateway-controller
  namespace: default
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: gcpgateway
spec:
  controllerName: gke-labs.io/gcpgateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcpgateway-controller
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gcpgateway-controller
  template:
    metadata:
      labels:
        app: gcpgateway-controller
    spec:
      serviceAccountName: gcpgateway-controller
      containers:
      - name: controller
        image: gcpgateway:latest
        env:
        - name: DATAPLANE_IMAGE
          value: gcpgateway:latest
        args:
        - --controller-name=gke-labs.io/gcpgateway
        - --dataplane-image=$(DATAPLANE_IMAGE)
        - --certserver-address=certserver.gateway-system.svc:8443
        - --certserver-ca-bundle-path=/etc/ssl/certs/certserver-ca.crt
        - --certserver-token-path=/var/run/secrets/tokens/certserver/token
        ports:
        - name: metrics
          containerPort: 8999
        volumeMounts:
        - name: certserver-token
          mountPath: /var/run/secrets/tokens/certserver
          readOnly: true
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8999
          initialDelaySeconds: 1
          periodSeconds: 2
      volumes:
      - name: certserver-token
        projected:
          sources:
          - serviceAccountToken:
              audience: certserver
              expirationSeconds: 600
              path: token

