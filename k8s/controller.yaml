apiVersion: v1
kind: ServiceAccount
metadata:
  name: gari-controller
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gari-controller
rules:
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes", "gateways", "gatewayclasses", "backendtlspolicies", "referencegrants", "listenersets"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["tlsroutes", "grpcroutes", "tcproutes", "udproutes"]
  verbs: ["get", "list", "watch"]
# Write access on secrets, roles, and rolebindings is required to provision per-Gateway data-plane RBAC and config Secrets.
- apiGroups: [""]
  resources: ["services", "serviceaccounts", "secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["configmaps", "namespaces", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways/status", "gatewayclasses/status", "httproutes/status", "backendtlspolicies/status", "listenersets/status", "tlsroutes/status", "grpcroutes/status", "tcproutes/status", "udproutes/status"]
  verbs: ["update", "patch"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  resourceNames:
  - "gatewayclasses.gateway.networking.k8s.io"
  - "gateways.gateway.networking.k8s.io"
  - "httproutes.gateway.networking.k8s.io"
  - "tlsroutes.gateway.networking.k8s.io"
  - "grpcroutes.gateway.networking.k8s.io"
  - "tcproutes.gateway.networking.k8s.io"
  - "udproutes.gateway.networking.k8s.io"
  - "backendtlspolicies.gateway.networking.k8s.io"
  - "listenersets.gateway.networking.k8s.io"
  - "referencegrants.gateway.networking.k8s.io"
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gari-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gari-controller
subjects:
- kind: ServiceAccount
  name: gari-controller
  namespace: default
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: reference-class
spec:
  controllerName: github.com/gke-labs/gateway-api-reference-implementation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gari-controller
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gari-controller
  template:
    metadata:
      labels:
        app: gari-controller
    spec:
      serviceAccountName: gari-controller
      containers:
      - name: controller
        image: gari-controller:latest
        env:
        - name: DATAPLANE_IMAGE
          value: ${IMAGE_PREFIX}/gari-controller
        args:
        - --dataplane-image=$(DATAPLANE_IMAGE)
        ports:
        - name: metrics
          containerPort: 8999
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8999
          initialDelaySeconds: 1
          periodSeconds: 2
