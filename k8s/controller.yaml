apiVersion: v1
kind: ServiceAccount
metadata:
  name: gari-controller
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gari-controller
rules:
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes", "gateways", "gatewayclasses", "backendtlspolicies"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: [""]
  resources: ["services", "configmaps", "serviceaccounts"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways/status", "gatewayclasses/status", "httproutes/status", "backendtlspolicies/status"]
  verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gari-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gari-controller
subjects:
- kind: ServiceAccount
  name: gari-controller
  namespace: default
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: reference-class
spec:
  controllerName: github.com/gke-labs/gateway-api-reference-implementation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gari-controller
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gari-controller
  template:
    metadata:
      labels:
        app: gari-controller
    spec:
      serviceAccountName: gari-controller
      containers:
      - name: controller
        image: gari-controller:e2e
        imagePullPolicy: Never
        env:
        - name: CONTROLLER_IMAGE
          value: gari-controller:e2e
        ports:
        - containerPort: 8080
          name: metrics
        - containerPort: 8081
          name: health
