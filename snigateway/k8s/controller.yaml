apiVersion: v1
kind: ServiceAccount
metadata:
  name: snigateway-controller
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: snigateway-controller
rules:
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes", "gateways", "gatewayclasses", "backendtlspolicies", "referencegrants", "listenersets", "tlsroutes", "grpcroutes"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: [""]
  resources: ["services", "configmaps", "secrets", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways/status", "gatewayclasses/status", "httproutes/status", "backendtlspolicies/status", "listenersets/status", "tlsroutes/status", "grpcroutes/status"]
  verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: snigateway-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: snigateway-controller
subjects:
- kind: ServiceAccount
  name: snigateway-controller
  namespace: default
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: snigateway
spec:
  controllerName: github.com/gke-labs/gateway-api-reference-implementation/snigateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snigateway-controller
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snigateway-controller
  template:
    metadata:
      labels:
        app: snigateway-controller
    spec:
      serviceAccountName: snigateway-controller
      containers:
      - name: controller
        image: snigateway:latest
        args:
        - "--controller-name=github.com/gke-labs/gateway-api-reference-implementation/snigateway"
        - "--frontend=snigateway-frontend.example.com:443"
        - "--tunnel-transport=auto"
        - "--ca-cert=/etc/snigateway/certs/ca.crt"
        - "--client-cert=/etc/snigateway/certs/client.crt"
        - "--client-key=/etc/snigateway/certs/client.key"
        volumeMounts:
        - name: client-certs
          mountPath: /etc/snigateway/certs
          readOnly: true
      volumes:
      - name: client-certs
        secret:
          secretName: snigateway-client-cert
