apiVersion: v1
kind: ServiceAccount
metadata:
  name: snigateway-controller
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: snigateway-controller
rules:
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes", "gateways", "gatewayclasses", "backendtlspolicies", "referencegrants", "listenersets", "tlsroutes", "grpcroutes", "tcproutes", "udproutes"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: [""]
  resources: ["services", "configmaps", "secrets", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways/status", "gatewayclasses/status", "httproutes/status", "backendtlspolicies/status", "listenersets/status", "tlsroutes/status", "grpcroutes/status", "tcproutes/status", "udproutes/status"]
  verbs: ["update", "patch"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  resourceNames:
  - "gatewayclasses.gateway.networking.k8s.io"
  - "gateways.gateway.networking.k8s.io"
  - "httproutes.gateway.networking.k8s.io"
  - "tlsroutes.gateway.networking.k8s.io"
  - "grpcroutes.gateway.networking.k8s.io"
  - "tcproutes.gateway.networking.k8s.io"
  - "udproutes.gateway.networking.k8s.io"
  - "backendtlspolicies.gateway.networking.k8s.io"
  - "listenersets.gateway.networking.k8s.io"
  - "referencegrants.gateway.networking.k8s.io"
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: snigateway-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: snigateway-controller
subjects:
- kind: ServiceAccount
  name: snigateway-controller
  namespace: default
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: snigateway
spec:
  controllerName: github.com/gke-labs/gateway-api-reference-implementation/snigateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snigateway-controller
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snigateway-controller
  template:
    metadata:
      labels:
        app: snigateway-controller
    spec:
      serviceAccountName: snigateway-controller
      containers:
      - name: controller
        image: snigateway:latest
        args:
        - "--controller-name=github.com/gke-labs/gateway-api-reference-implementation/snigateway"
        - "--frontend=snigateway-frontend.example.com:443"
        - "--ca-cert=/etc/snigateway/certs/ca.crt"
        - "--client-cert=/etc/snigateway/certs/client.crt"
        - "--client-key=/etc/snigateway/certs/client.key"
        # The container runs as non-root (65532) and the snigateway binary carries
        # file capability cap_net_admin+ep. allowPrivilegeEscalation: true is
        # required because setting allowPrivilegeEscalation: false (no_new_privs)
        # prevents non-root processes from gaining file capabilities on execve.
        # CAP_NET_ADMIN is required to configure the WireGuard wg0 interface and
        # kernel routes in the pod's network namespace. The namespace must use a
        # non-restricted Pod Security level (e.g. privileged or an exemption)
        # because the restricted level disallows CAP_NET_ADMIN and requires
        # allowPrivilegeEscalation: false. The cluster network must allow outbound
        # UDP traffic to the frontend's WireGuard listen port.
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: true
          capabilities:
            drop:
            - ALL
            add:
            - NET_ADMIN
        volumeMounts:
        - name: client-certs
          mountPath: /etc/snigateway/certs
          readOnly: true
      volumes:
      - name: client-certs
        secret:
          secretName: snigateway-client-cert
